# Browser walkthroughs (e2e/): builds the game once, then runs each
# walkthrough at the same time on its own machine, so the whole check takes
# about as long as the slowest one (Quiz) instead of every one in a row.
# The list comes from `node e2e/run.mjs --list`. A failed walkthrough uploads
# its screenshots.
#
# On a stronger PC instead: set the repository variable E2E_RUNNER to "pc"
# (Settings > Secrets and variables > Actions > Variables) once a
# self-hosted Windows runner with the label "kidsmath" is installed (see
# README, "Walkthroughs on your own PC"). The PC then runs every
# walkthrough in one job, and GitHub's machines are not used. Pull requests
# from forks always stay on GitHub's machines: a public repository must not
# run strangers' code on a home PC. If the PC is off, its job waits; set
# E2E_RUNNER back to empty (or anything else) to use GitHub's machines.
name: Browser walkthroughs

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# A newer push to the same branch replaces a run in progress.
concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pc:
    if: vars.E2E_RUNNER == 'pc' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: [self-hosted, Windows, kidsmath]
    timeout-minutes: 90
    env:
      # How many walkthroughs at once (empty: half the CPUs, up to 4).
      E2E_JOBS: ${{ vars.E2E_JOBS }}
      # "1": draw with the PC's graphics card instead of the CPU.
      E2E_GPU: ${{ vars.E2E_GPU }}
      # "1": draw at normal resolution (a quarter of the pixels; empty: 2).
      E2E_SCALE: ${{ vars.E2E_SCALE }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npx playwright install chromium

      - name: Build (under the GitHub Pages path, like npm run e2e:local)
        run: npx vite build --outDir dist-e2e --emptyOutDir
        env:
          BASE_URL: /KidsMathApp/

      - name: Run every walkthrough
        run: node e2e/run.mjs e2e-shots --serve dist-e2e

      - name: Screenshots of the failed run
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: shots-pc
          path: e2e-shots
          retention-days: 7

  build:
    # GitHub's machines, unless the PC above runs the walkthroughs.
    if: vars.E2E_RUNNER != 'pc' || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository)
    # ubuntu-latest (26.04) has no Chromium for Playwright 1.56.
    runs-on: ubuntu-24.04
    outputs:
      walkthroughs: ${{ steps.list.outputs.walkthroughs }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Build (under the GitHub Pages path, like npm run e2e:local)
        run: npx vite build --outDir dist-e2e --emptyOutDir
        env:
          BASE_URL: /KidsMathApp/

      - uses: actions/upload-artifact@v7
        with:
          name: dist-e2e
          path: dist-e2e
          retention-days: 1

      - id: list
        run: echo "walkthroughs=$(node e2e/run.mjs --list)" >> "$GITHUB_OUTPUT"

  walkthrough:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.build.outputs.walkthroughs) }}
    name: ${{ matrix.name }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npx playwright install --with-deps chromium

      - uses: actions/download-artifact@v8
        with:
          name: dist-e2e
          path: dist-e2e

      - name: Run ${{ matrix.name }}
        run: node e2e/run.mjs e2e-shots --serve dist-e2e --only "${{ matrix.name }}"

      - name: Screenshots of the failed run
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: shots-${{ strategy.job-index }}
          path: e2e-shots
          retention-days: 7
